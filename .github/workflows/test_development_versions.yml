name: Development version tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    - cron: '0 1 * * *'

jobs:
  tests:
    name: development version tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      - name: Install tools from pypi
        run: |
          python -m pip install tox build 'extremal-python-dependencies<2'
      - name: Build Qiskit SDK development wheel
        run: |
          git clone https://github.com/Qiskit/qiskit
          cd qiskit
          git rev-parse HEAD
          python -m build --wheel
      - name: Build qiskit-ibm-runtime development wheel
        run: |
          git clone https://github.com/Qiskit/qiskit-ibm-runtime
          cd qiskit-ibm-runtime
          git rev-parse HEAD
          python -m build --wheel
      - name: Build qiskit-addon-utils development wheel
        run: |
          git clone https://github.com/Qiskit/qiskit-addon-utils
          cd qiskit-addon-utils
          git rev-parse HEAD
          # Unpin qiskit<2
          extremal-python-dependencies pin-dependencies --inplace qiskit
          python -m build --wheel
      - name: Build qiskit-quimb development wheel
        run: |
          git clone https://github.com/qiskit-community/qiskit-quimb
          cd qiskit-quimb
          git rev-parse HEAD
          python -m build --wheel
      - name: Build quimb development wheel
        run: |
          git clone https://github.com/jcmgray/quimb
          cd quimb
          git rev-parse HEAD
          python -m build --wheel
      - name: Pin development versions
        shell: bash
        run: >-
          extremal-python-dependencies pin-dependencies --inplace
          "qiskit @ file:$PWD/$(echo qiskit/dist/*.whl)"
          "qiskit-ibm-runtime @ file:$PWD/$(echo qiskit-ibm-runtime/dist/*.whl)"
          "qiskit-addon-utils @ file:$PWD/$(echo qiskit-addon-utils/dist/*.whl)"
          "qiskit-quimb @ file:$PWD/$(echo qiskit-quimb/dist/*.whl)"
          "quimb @ file:$PWD/$(echo quimb/dist/*.whl)"
      # The scientific-python nightly channel already publishes scipy, so
      # it is downloaded rather than built.
      #
      # Its wheels start at cp312, so the 3.11 leg has nothing to download
      # and keeps testing against a released scipy.
      - name: Pin scipy pre-release
        if: matrix.python-version != '3.11'
        shell: bash
        run: |
          pip download --no-deps --pre -d scipy-prerelease \
            -i https://pypi.anaconda.org/scientific-python-nightly-wheels/simple \
            scipy
          extremal-python-dependencies pin-dependencies --inplace \
            "scipy @ file:$PWD/$(echo scipy-prerelease/*.whl)"
      - name: Test using tox environment
        run: |
          tox -e py,notebook,quimb-only,aer-only --parallel --parallel-no-spinner
